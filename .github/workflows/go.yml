name: Go validation

on:
    push:
        branches:
            - "**"
    pull_request:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23.x"
                  cache: true

            - name: Check gofmt
              run: |
                  files="$(gofmt -l .)"
                  if [ -n "$files" ]; then
                      printf '%s\n' "$files"
                      exit 1
                  fi

            - name: Run unit tests
              run: go test ./...

            - name: Run race tests
              run: go test -race ./...

            - name: Run go vet
              run: go vet ./...

            - name: Build Linux AMD64
              env:
                  GOOS: linux
                  GOARCH: amd64
              run: go build ./...

            - name: Build Linux ARM64
              env:
                  GOOS: linux
                  GOARCH: arm64
              run: go build ./...
