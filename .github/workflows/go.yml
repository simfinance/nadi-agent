name: Go validation

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

concurrency:
    group: go-validation-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    format:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Agent branch
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23.x"

            - name: Format Go source
              run: gofmt -w .

            - name: Commit formatting changes
              run: |
                  if [ -n "$(git status --porcelain -- '*.go')" ]; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add '*.go'
                      git commit -m "Apply gofmt to Agent changes"
                      git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
                  fi

    validate:
        needs: format
        if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Agent branch
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23.x"

            - name: Check gofmt
              run: |
                  files="$(gofmt -l .)"
                  if [ -n "$files" ]; then
                      printf '%s\n' "$files"
                      exit 1
                  fi

            - name: Run unit tests
              run: go test ./...

            - name: Run race tests
              run: go test -race ./...

            - name: Run go vet
              run: go vet ./...

            - name: Build Linux AMD64
              env:
                  GOOS: linux
                  GOARCH: amd64
              run: go build ./...

            - name: Build Linux ARM64
              env:
                  GOOS: linux
                  GOARCH: arm64
              run: go build ./...

            - name: Build and install Debian helper bootstrap packages
              shell: bash
              run: |
                  set -euo pipefail

                  temporary_directory="$(mktemp -d)"
                  trap 'sudo rm -f /etc/sudoers.d/nadi-provision-ci; sudo userdel nadi-bootstrap-ci >/dev/null 2>&1 || true; sudo dpkg -r nadi-provision-helper >/dev/null 2>&1 || true; rm -rf "$temporary_directory"' EXIT

                  openssl genpkey -algorithm ED25519 -out "$temporary_directory/test-signing-private.pem"
                  openssl pkey -in "$temporary_directory/test-signing-private.pem" -pubout -out "$temporary_directory/test-signing-public.pem"

                  agent_version="$(sed -nE 's/^[[:space:]]*Agent[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/version/version.go)"
                  if [ -z "$agent_version" ]; then
                      printf 'Unable to read Agent version from source.\n' >&2
                      exit 1
                  fi

                  for architecture in amd64 arm64; do
                      binary_path="$temporary_directory/nadi-agent-$architecture"
                      package_path="$temporary_directory/nadi-provision-helper_${agent_version}_${architecture}.deb"

                      GOOS=linux GOARCH="$architecture" CGO_ENABLED=0 go build -o "$binary_path" ./cmd/nadi-agent
                      digest="$(sha256sum "$binary_path" | awk '{print $1}')"

                      scripts/build-helper-deb.sh \
                          "$binary_path" \
                          "${agent_version}" \
                          "$architecture" \
                          "$digest" \
                          "$package_path"

                      scripts/test-helper-deb.sh "$package_path" "${agent_version}" "$architecture"

                      openssl pkeyutl \
                          -sign \
                          -rawin \
                          -inkey "$temporary_directory/test-signing-private.pem" \
                          -in "$package_path" \
                          -out "$package_path.sig"

                      openssl pkeyutl \
                          -verify \
                          -pubin \
                          -inkey "$temporary_directory/test-signing-public.pem" \
                          -rawin \
                          -in "$package_path" \
                          -sigfile "$package_path.sig"

                      if scripts/verify-helper-package-signature.sh \
                          "$temporary_directory/test-signing-public.pem" \
                          "$package_path" \
                          "$package_path.sig" 2>"$temporary_directory/verify-error.txt"; then
                          printf 'Verifier accepted a public key outside the pinned NADI trust anchor.\n' >&2
                          exit 1
                      fi
                      grep -F 'Release public key fingerprint does not match' "$temporary_directory/verify-error.txt"

                      if scripts/sign-helper-package.sh \
                          "$temporary_directory/test-signing-private.pem" \
                          "$package_path" \
                          "$package_path.production-test.sig" 2>"$temporary_directory/sign-error.txt"; then
                          printf 'Signer accepted a private key outside the pinned NADI trust anchor.\n' >&2
                          exit 1
                      fi
                      grep -F 'Release private key does not match the pinned NADI trust anchor' "$temporary_directory/sign-error.txt"
                  done

                  sudo dpkg -i "$temporary_directory/nadi-provision-helper_${agent_version}_amd64.deb"

                  installed_metadata="$(stat -c '%u:%g:%a' /usr/libexec/nadi/nadi-provision)"
                  if [ "$installed_metadata" != "0:0:755" ]; then
                      printf 'Installed helper metadata is invalid: %s\n' "$installed_metadata" >&2
                      exit 1
                  fi

                  sudo useradd --system --no-create-home --shell /usr/sbin/nologin nadi-bootstrap-ci
                  sudoers_file="/etc/sudoers.d/nadi-provision-ci"
                  printf '%s\n' 'nadi-bootstrap-ci ALL=(root) NOPASSWD: /usr/libexec/nadi/nadi-provision --request-stdin' | sudo tee "$sudoers_file" >/dev/null
                  sudo chown root:root "$sudoers_file"
                  sudo chmod 0440 "$sudoers_file"
                  sudo visudo -cf "$sudoers_file"

                  if printf '%s' '{"protocol_version":999,"operation":"start_agent"}' | sudo -u nadi-bootstrap-ci /usr/bin/sudo -n -- /usr/libexec/nadi/nadi-provision --request-stdin > "$temporary_directory/helper-response.json" 2> "$temporary_directory/helper-error.txt"; then
                      printf 'The helper unexpectedly accepted an invalid protocol version.\n' >&2
                      exit 1
                  fi

                  grep -F '"phase":"request_validation"' "$temporary_directory/helper-response.json"
                  grep -F '"success":false' "$temporary_directory/helper-response.json"

                  sudo rm -f "$sudoers_file"
                  sudo userdel nadi-bootstrap-ci
                  sudo dpkg -r nadi-provision-helper
