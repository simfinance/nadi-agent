name: Go validation

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

concurrency:
    group: go-validation-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    format:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Agent branch
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23.x"

            - name: Format Go source
              run: gofmt -w .

            - name: Commit formatting changes
              run: |
                  if [ -n "$(git status --porcelain -- '*.go')" ]; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add '*.go'
                      git commit -m "Apply gofmt to Agent changes"
                      git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
                  fi

    validate:
        needs: format
        if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Agent branch
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23.x"

            - name: Check gofmt
              run: |
                  files="$(gofmt -l .)"
                  if [ -n "$files" ]; then
                      printf '%s\n' "$files"
                      exit 1
                  fi

            - name: Run unit tests
              run: go test ./...

            - name: Run race tests
              run: go test -race ./...

            - name: Run go vet
              run: go vet ./...

            - name: Build Linux AMD64
              env:
                  GOOS: linux
                  GOARCH: amd64
              run: go build ./...

            - name: Build Linux ARM64
              env:
                  GOOS: linux
                  GOARCH: arm64
              run: go build ./...
