name: Go validation

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

permissions:
    contents: read

concurrency:
    group: go-validation-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    format:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Agent branch
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23.x"

            - name: Format Go source
              run: gofmt -w .

            - name: Commit formatting changes
              run: |
                  if [ -n "$(git status --porcelain -- '*.go')" ]; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add '*.go'
                      git commit -m "Apply gofmt to Agent changes"
                      git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
                  fi

    validate:
        needs: format
        if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Agent branch
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23.x"

            - name: Check gofmt
              run: |
                  files="$(gofmt -l .)"
                  if [ -n "$files" ]; then
                      printf '%s\n' "$files"
                      exit 1
                  fi

            - name: Run unit tests
              run: go test ./...

            - name: Run race tests
              run: go test -race ./...

            - name: Run go vet
              run: go vet ./...

            - name: Build Linux AMD64
              env:
                  GOOS: linux
                  GOARCH: amd64
              run: go build ./...

            - name: Build Linux ARM64
              env:
                  GOOS: linux
                  GOARCH: arm64
              run: go build ./...

            - name: Build and install Debian helper bootstrap packages
              shell: bash
              run: |
                  set -euo pipefail

                  temporary_directory="$(mktemp -d)"
                  trap 'sudo dpkg -r nadi-provision-helper >/dev/null 2>&1 || true; rm -rf "$temporary_directory"' EXIT

                  for architecture in amd64 arm64; do
                      binary_path="$temporary_directory/nadi-agent-$architecture"
                      package_path="$temporary_directory/nadi-provision-helper_0.7.5_$architecture.deb"

                      GOOS=linux GOARCH="$architecture" CGO_ENABLED=0 go build -o "$binary_path" ./cmd/nadi-agent
                      digest="$(sha256sum "$binary_path" | awk '{print $1}')"

                      scripts/build-helper-deb.sh \
                          "$binary_path" \
                          "0.7.5" \
                          "$architecture" \
                          "$digest" \
                          "$package_path"

                      scripts/test-helper-deb.sh "$package_path" "0.7.5" "$architecture"

                      sudo dpkg -i "$package_path"

                      installed_metadata="$(stat -c '%u:%g:%a' /usr/libexec/nadi/nadi-provision)"
                      if [ "$installed_metadata" != "0:0:755" ]; then
                          printf 'Installed helper metadata is invalid: %s\\n' "$installed_metadata" >&2
                          exit 1
                      fi

                      sudo dpkg -r nadi-provision-helper
                  done
